version: '3.8'

services:
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    env_file: .env
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
      - "50000-50050:50000-50050/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning

  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    # Issue 9: turnserver.conf had static-auth-secret=YOUR_COTURN_SECRET and
    # external-ip=YOUR_PUBLIC_IP as literal, un-substituted placeholders -
    # coturn was reading that literal string as the secret, which could
    # never match the credentials LiveKit computes from COTURN_SECRET in
    # .env. The TURN relay (the fallback that rescues connectivity for any
    # device that can't reach node_ip directly - i.e. most real phones on
    # cellular/NAT) was therefore silently non-functional. CLI flags below
    # override the same keys from the mounted config file and are filled
    # from this directory's .env, so there's exactly one place to configure
    # these values instead of two files that can drift out of sync.
    command: >
      -c /etc/coturn/turnserver.conf
      --external-ip=${PUBLIC_IP}
      --static-auth-secret=${COTURN_SECRET}
      --realm=${DOMAIN}
      --server-name=${DOMAIN}

  # Caddy reverse proxy for automatic SSL termination of WebSocket/API
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
